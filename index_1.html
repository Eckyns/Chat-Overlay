<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Overlay</title>
<!--
  TWITCH CHAT OVERLAY  —  OBS Browser Source
  ------------------------------------------------------------
  1. Open this page in a browser (the hosted link, or double-click the file).
     You get a live preview plus a settings panel. Type your channel, pick
     your options, then press "Copy OBS URL".
  2. In OBS: Sources > + > Browser. Leave "Local file" UNticked and paste the
     copied URL into the URL box. Suggested size: 460 x 760.
  Sharing: host this one file anywhere public (e.g. GitHub Pages). Everyone who
  opens the link gets the settings panel and builds their own OBS URL.

  Every option can also be typed into the URL by hand (add with &):
    channel=name        your Twitch channel (no channel = preview + settings panel)
    side=left           left | right
    scale=1             overall size multiplier
    max=12              most messages on screen
    fade=30             seconds before a message fades (0 = never)
    hue=19              main colour, 0-359 on the colour wheel (leave out for burnt orange)

    EMOTES
    emotes=bubble       bubble = solo-emote messages get big emotes in orange circles
                        inline = emotes always stay text-sized
                        text   = no emote images, show their names as text
    emotesize=1         emote size multiplier (inline and big)
    emotemax=3          big emotes shown before the "+N" counter
    emotering=1         circle behind big emotes (0 = emotes float on their own)
    animated=1          animated Twitch emotes (0 = still images)
    thirdparty=bttv,ffz,7tv   which extra emote sets to load (0 = none)

    EXTRAS
    typing=0            letters type in one by one (1 = on)
    badges=1            real Twitch badges, incl. your channel's own sub & bit badges
    anchor=1            anchor + logo at the end of each boat line
    logo=https://...    use your own logo image next to the anchor instead of the sailboat
    bob=1               boats gently bob on the water
    portholes=1         round portholes on the hull line (0 = plain hull)
    roles=1             role name on the name tag (Streamer, Head Mod, Mod, VIP, Artist, Founder)
    headmods=a,b        extra people to show as Head Mod (Twitch's Lead Moderator badge is detected automatically)
    events=1            show subs, gifted subs and raids
    hidecmds=1          hide messages that start with "!"
    bots=nightbot,...   accounts to hide

    MULTISTREAM (optional — YouTube, Kick, etc. alongside Twitch)
    ssn=SESSION_ID      your Social Stream Ninja session ID (free tool: socialstream.ninja).
                        In Social Stream Ninja: Global settings > Mechanics > turn on
                        "Enable remote API control of extension" and "Send chat messages to API server".
                        Twitch still comes in directly (badges, emotes, alerts); its copy from
                        Social Stream Ninja is skipped so nothing shows twice.
    platformicons=1     small YouTube / Twitch / Kick icon on each name flag (multistream only)

  Reads chat anonymously — no login or token needed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --scale:1; --es:1;
    --hull:#b4562a; --hulltext:#f4ecdc; --stripe:#9a4824; --waterline:#1f2a36; --mention:#eaa47c;
    --cream:#e9dfca; --wood:#5e4129; --flag:#ece3cf; --flagtext:#2a2420;
  }
  html,body{margin:0;height:100%;background:transparent!important;overflow:hidden}
  body.demo{background:var(--previewbg,#56606b)!important}   /* browser preview only — never in OBS */
  #obsnote{position:absolute;left:12px;top:12px;max-width:340px;padding:10px 12px;border-radius:8px;background:rgba(20,22,26,.85);
    color:#e8e3d9;font:600 13px/1.45 system-ui,sans-serif}
  #obsnote b{color:#d3a37a}
  body{font-size:calc(16px*var(--scale));color:#f4ecdc}
  #chat{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
        padding:calc(16px*var(--scale)) calc(18px*var(--scale)) calc(20px*var(--scale));box-sizing:border-box;gap:calc(12px*var(--scale))}
  body.left  #chat{align-items:flex-start}
  body.right #chat{align-items:flex-end}
  body.demo #chat{right:auto;width:min(480px,100%)}

  /* ---------- shared pieces ---------- */
  .msg{max-width:100%;box-sizing:border-box;overflow-wrap:anywhere}
  .badges{display:inline-flex;align-items:center;gap:.25em;margin-right:.45em;vertical-align:-.24em}
  .badges img{height:1.25em;width:auto;display:block}
  .emote{height:calc(1.75em*var(--es));vertical-align:middle;margin:-.3em .06em}
  .dot{display:none}
  .bigemotes{display:flex;align-items:center;flex-wrap:wrap;gap:calc(10px*var(--scale))}
  .bigemote{--bes:calc(76px*var(--scale)*var(--es));width:var(--bes);height:var(--bes);flex:none;
            display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
  .bigemote img{width:80%;height:80%;object-fit:contain}
  .more{font-weight:800;font-size:.75em;padding:.45em .75em;border-radius:999px;animation:pop .45s .3s both}
  .ev{display:flex;flex-wrap:wrap;gap:calc(9px*var(--scale));align-items:center}
  .ev .tag,.ev .info{border-radius:999px;padding:.6em 1.2em;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .ev .tag{white-space:nowrap}
  .typing .ch,.typing .body .emote{opacity:0;animation:chIn .18s ease forwards}
  body.ring0 .bigemote{background:transparent!important;box-shadow:none!important}
  body.ring0 .bigemote img{width:100%;height:100%}
  @keyframes chIn{to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

  .role{display:inline-block;margin-left:.55em;padding:.14em .45em .1em;border-radius:4px;background:var(--rc);color:var(--ri);
    font-size:.8em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;vertical-align:.06em;font-style:normal}

  /* ---------- BOAT LINES: compact one-line chat, each line a little boat ---------- */
  body.lines{font-family:'Manrope',system-ui,sans-serif;font-weight:700;font-size:calc(19px*var(--scale));color:#f4ecdc;
    --mention:#eaa47c}
  body.lines #chat{gap:calc(9px*var(--scale))}
  /* the message + a slim hull underneath it */
  body.lines .msg{position:relative;z-index:0;width:fit-content;line-height:1.38;padding:0 calc(6px*var(--scale)) calc(8px*var(--scale)) 0;
    transform-origin:30% 100%;animation:lineIn .6s cubic-bezier(.2,.9,.3,1) both;
    text-shadow:0 0 2px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.9),1px 1px 0 rgba(0,0,0,.7)}
  body.lines.bob .msg{animation:lineIn .6s cubic-bezier(.2,.9,.3,1) both,bobLine var(--bobd,4s) ease-in-out .6s infinite}
  /* the hull under each message — built from the supplied hull asset: cream deck band, orange hull,
     grey-ringed portholes (always whole), square stern and a slanted bow. Sits in the existing gap, so nothing moves. */
  body.lines .msg::after{content:"";position:absolute;z-index:-1;box-sizing:border-box;
    left:calc(-2px*var(--scale));right:calc(-8px*var(--scale));bottom:calc(-1.0px*var(--scale));height:calc(8.0px*var(--scale));
    padding:0 calc(14.5px*var(--scale)) 0 calc(4.5px*var(--scale));
    clip-path:polygon(0 0,100% 0,calc(100% - 9.5px*var(--scale)) 100%,0 100%);
    background:
      radial-gradient(circle closest-side,#303030 0 68%,#bababa 74% 92%,transparent 100%)
        0 calc(1.58px*var(--scale)) / calc(31.67px*var(--scale)) calc(5.67px*var(--scale)) space no-repeat content-box,
      linear-gradient(var(--cream),var(--cream)) 0 0 / 100% calc(1.17px*var(--scale)) no-repeat border-box,
      var(--hull)}
  /* the shadow: a dark waterline under the hull and a soft shadow fading below it, following the bow */
  body.lines .msg::before{content:"";position:absolute;z-index:-1;
    left:calc(-2px*var(--scale));right:calc(-8px*var(--scale));bottom:calc(-7.0px*var(--scale));height:calc(14.0px*var(--scale));
    clip-path:polygon(0 0,100% 0,calc(100% - 16.62px*var(--scale)) 100%,0 100%);
    background:linear-gradient(to bottom,transparent calc(8.0px*var(--scale)),var(--waterline) calc(8.0px*var(--scale)) calc(10.0px*var(--scale)),rgba(0,0,0,.4) calc(10.0px*var(--scale)),transparent 100%)}
  body.lines.noports .msg::after{background-image:none,linear-gradient(var(--cream),var(--cream))}   /* portholes off */
  body.lines .msg.anc::before{right:calc(3.75em - 8px*var(--scale))}
  body.lines .msg.out{animation:lineOut .6s ease-in forwards!important}
  body.lines.right .msg{text-align:right;padding:0 0 calc(8px*var(--scale)) calc(6px*var(--scale));transform-origin:70% 100%}
  /* the name = a small parchment flag on a mast */
  body.lines .name{position:relative;display:inline-block;padding-left:calc(4px*var(--scale));margin-right:.45em;vertical-align:.06em}
  body.lines .name::before{content:"";position:absolute;left:0;top:-.2em;bottom:-.35em;width:calc(2.5px*var(--scale));border-radius:2px;background:var(--wood);
    box-shadow:0 0 2px rgba(0,0,0,.6)}
  body.lines .nm{display:inline-block;background:linear-gradient(to right,var(--uc) 0 .34em,var(--flag) .34em);color:var(--flagtext);
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:.86em;letter-spacing:.08em;text-transform:uppercase;
    text-shadow:none;line-height:1.25;padding:.1em 1.35em .06em .7em;
    clip-path:polygon(0 0,100% 0,calc(100% - .62em) 50%,100% 100%,0 100%);transform-origin:0 50%;animation:flutter 2.6s ease-in-out infinite}
  body.lines.right .name{padding-left:0;padding-right:calc(4px*var(--scale));margin:0 0 0 .45em}
  body.lines.right .name::before{left:auto;right:0}
  body.lines.right .nm{background:linear-gradient(to left,var(--uc) 0 .34em,var(--flag) .34em);padding:.1em .7em .06em 1.35em;
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%,.62em 50%);transform-origin:100% 50%}
  body.lines .badges{margin-right:.35em;vertical-align:-.2em}
  .plat{display:inline-flex;vertical-align:-.2em;margin-right:.35em}
  .plat svg{width:1.1em;height:1.1em;display:block}
  body.lines .badges img{height:1.15em}
  body.lines .role{font-size:.82em;letter-spacing:.09em;margin-left:.5em;vertical-align:.05em}
  body.lines .row,body.lines .body{display:inline}
  body.lines .action .body{color:var(--uc);font-style:italic}
  body.lines .mention{color:var(--mention)}
  /* ---------- alerts: subs, gifts, raids, bits get their own wooden card with an animated drawing ---------- */
  body.lines .msg.event,body.lines.bob .msg.event{display:flex;align-items:center;gap:.5em;padding:.15em 0;margin:calc(3px*var(--scale)) 0;
    font-size:.9em;color:#f4ecdc;background:none;box-shadow:none;
    text-shadow:0 0 2px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.9),1px 1px 0 rgba(0,0,0,.7);
    animation:alertIn .75s cubic-bezier(.2,1.4,.4,1) both}
  body.lines .msg.event::after,body.lines .msg.event::before{display:none}
  .evart{flex:none;width:2.5em;height:2.5em;filter:drop-shadow(0 1px 2px rgba(0,0,0,.75))}
  .evart svg{width:100%;height:100%;display:block;overflow:visible}
  .evart svg *{transform-box:fill-box}
  .evtitle{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:.8em;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mention);line-height:1.15}
  .evline{font-weight:700;line-height:1.3}
  .evname{color:var(--uc)}
  /* gifted subs: the barrel drops onto the plank and rocks */
  .ev-gift .evart svg{transform-origin:50% 92%;animation:barrelDrop .9s cubic-bezier(.3,1.5,.5,1) .15s both,barrelRock 2.8s ease-in-out 1.1s infinite}
  /* raids: the cannons recoil and fire, flash + smoke */
  .ev-raid .cn{animation:recoil 1.5s ease-out 3}
  .ev-raid .flash{opacity:0;transform-origin:center;animation:flash 1.5s ease-out 3}
  .ev-raid .puff{opacity:0;transform-origin:center;animation:puff 1.5s ease-out 3}
  .ev-raid .b2 .cn,.ev-raid .b2 .flash,.ev-raid .b2 .puff{animation-delay:.45s}
  .ev-raid .puff.p2{animation-name:puff2}
  /* subs: the ship's bell swings */
  .ev-sub .evart svg{transform-origin:50% 6%;animation:bellRing 1.8s ease-out .2s both,bellIdle 3.2s ease-in-out 2s infinite}
  /* bits: the chest bounces in and sparkles */
  .ev-bits .evart svg{transform-origin:50% 100%;animation:barrelDrop .8s cubic-bezier(.3,1.5,.5,1) .15s both}
  .ev-bits .spark{transform-origin:center;animation:spark 1.6s ease-in-out infinite}
  .ev-bits .spark.s2{animation-delay:.55s}.ev-bits .spark.s3{animation-delay:1.1s}
  @keyframes alertIn{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes barrelDrop{from{opacity:0;transform:translateY(-1.4em) rotate(-25deg)}to{opacity:1;transform:none}}
  @keyframes barrelRock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes recoil{0%,100%{transform:none}6%{transform:translateX(3px)}25%{transform:none}}
  @keyframes flash{0%{opacity:0;transform:scale(.3)}5%{opacity:1;transform:scale(1)}18%{opacity:0;transform:scale(1.3)}100%{opacity:0}}
  @keyframes puff{0%,4%{opacity:0;transform:translate(0,0) scale(.3)}12%{opacity:.95}60%{opacity:0;transform:translate(-7px,-4px) scale(1.6)}100%{opacity:0}}
  @keyframes puff2{0%,6%{opacity:0;transform:translate(0,0) scale(.3)}16%{opacity:.8}70%{opacity:0;transform:translate(-10px,3px) scale(1.8)}100%{opacity:0}}
  @keyframes bellRing{0%{transform:rotate(22deg)}20%{transform:rotate(-16deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}100%{transform:none}}
  @keyframes bellIdle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
  /* solo emotes: their own look — each emote big inside a solid dark circle, extra ones as a small +N pill */
  body.lines .emoteonly .name{vertical-align:middle}
  body.lines .emoteonly .row{display:inline}
  body.lines .bigemotes{display:inline-flex;vertical-align:middle;align-items:center;gap:calc(8px*var(--scale));padding:.12em 0 .1em}
  body.lines .bigemote{--bes:calc(3.3em*var(--es));border-radius:50%;background:var(--hull);box-shadow:0 2px 4px rgba(0,0,0,.4)}
  body.lines .bigemote img{width:84%;height:84%}
  body.lines .more{background:var(--hull);color:var(--hulltext);text-shadow:none;font-family:'Manrope',system-ui,sans-serif;font-weight:800;
    font-size:.7em;padding:.4em .7em;letter-spacing:0;box-shadow:0 2px 4px rgba(0,0,0,.35)}
  @keyframes lineIn{from{opacity:0;transform:translateX(-40px) rotate(-2deg)}to{opacity:1;transform:none}}
  @keyframes lineOut{to{opacity:0;transform:translateY(14px) rotate(3deg)}}
  /* anchor + logo at the end of each line — the hull stops just after the words, so they sit clearly apart from the message */
  body.lines .msg.anc{padding-right:3.75em}
  body.lines .msg.anc::after{right:calc(3.75em - 8px*var(--scale))}
  body.lines .anchor{position:absolute;right:.15em;bottom:calc(6px*var(--scale));display:inline-flex;align-items:center;
    transform-origin:20% 10%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.85));text-shadow:none}
  body.lines .emoteonly .anchor{bottom:calc(6px*var(--scale) + .95em*var(--es))}
  body.lines.bob .anchor{animation:anchorSwing 3.8s ease-in-out infinite}
  body.lines .anchor svg{height:1.55em;width:auto;flex:none}
  body.lines .anchor img{height:1.45em;width:auto;margin-left:.05em}
  @keyframes anchorSwing{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
  @keyframes flutter{0%,100%{transform:none}50%{transform:skewY(-3deg) scaleX(.96)}}
  @keyframes bobLine{0%,100%{transform:none}25%{transform:translateY(-1.1px) rotate(-.25deg)}75%{transform:translateY(1.1px) rotate(.25deg)}}

  /* ---------- settings panel (preview mode only) ---------- */
  #panel{position:fixed;top:12px;right:12px;width:300px;max-height:calc(100vh - 24px);overflow:auto;box-sizing:border-box;
    background:#1f2328;color:#e8e3d9;font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;font-weight:500;
    border-radius:14px;padding:14px 16px 16px;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:10}
  #panel.hidden{display:none}
  #panel h2{font-size:15px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
  #panel p{margin:0 0 6px;color:#a59f95;font-size:12px}
  #panel fieldset{border:0;border-top:1px solid #353b43;margin:12px 0 0;padding:6px 0 0}
  #panel legend{font-weight:700;color:#d3a37a;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0 6px 0 0}
  #panel label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0}
  #panel input[type=text],#panel input[type=number],#panel select{width:140px;box-sizing:border-box;background:#2b3037;border:1px solid #3f4650;color:#fff;border-radius:6px;padding:5px 7px;font:inherit}
  #panel input[type=range]{width:110px;accent-color:#b4562a}
  #panel input[type=checkbox]{width:16px;height:16px;accent-color:#b4562a}
  #panel input[type=color]{width:44px;height:26px;border:0;background:none;padding:0}
  #panel input.hue{-webkit-appearance:none;appearance:none;width:118px;height:12px;border-radius:999px;margin:0;cursor:pointer;
    background:linear-gradient(to right,hsl(0 75% 55%),hsl(60 75% 55%),hsl(120 75% 45%),hsl(180 75% 45%),hsl(240 75% 60%),hsl(300 75% 55%),hsl(359 75% 55%))}
  #panel input.hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--hull);box-shadow:0 1px 4px rgba(0,0,0,.4)}
  #panel input.hue::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--hull)}
  #panel .sw{display:inline-block;width:30px;height:16px;border-radius:999px;background:var(--hull);box-shadow:inset 0 0 0 3px var(--mention);flex:none}
  #panel .link{background:none;border:0;color:#d3a37a;font:600 12px system-ui,sans-serif;cursor:pointer;padding:0;text-decoration:underline}
  #panel .rv{display:flex;align-items:center;gap:6px}
  #panel .rv output{width:34px;text-align:right;color:#a59f95;font-variant-numeric:tabular-nums}
  #panel textarea{width:100%;box-sizing:border-box;height:70px;margin-top:6px;background:#16191d;border:1px solid #3f4650;color:#d6cfc2;border-radius:8px;padding:6px 8px;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:none}
  #panel .btn{margin-top:8px;width:100%;background:#b4562a;color:#f4ecdc;border:0;border-radius:8px;padding:9px;font:700 13px system-ui,sans-serif;cursor:pointer}
  #panel .btn2{background:#3a4049;color:#e8e3d9}
  #panel .x{background:none;border:0;color:#a59f95;font-size:18px;cursor:pointer;padding:0 2px}
  #panel .warn{color:#ffcf6b;font-size:12px;margin-top:6px}
  #gear{position:fixed;top:12px;right:12px;z-index:10;background:#1f2328;color:#e8e3d9;border:0;border-radius:999px;padding:8px 14px;font:700 13px system-ui,sans-serif;cursor:pointer;display:none}
  #gear.show{display:block}
</style>
</head>
<body>
<div id="chat"></div>

<script>
(() => {
  const P = new URLSearchParams(location.search);
  const DEFAULT_BOTS = 'nightbot,streamelements,streamlabs,moobot,fossabot,wizebot';
  const DEF = {
    side:'left', scale:'1', max:'12', fade:'30',
    emotes:'bubble', emotesize:'1', emotemax:'3', emotering:'1', animated:'1', thirdparty:'bttv,ffz,7tv',
    typing:'0', badges:'1', anchor:'1', logo:'', events:'1', bob:'1', portholes:'1', roles:'1', headmods:'', hidecmds:'1', bots:DEFAULT_BOTS, ssn:'', platformicons:'1',
  };
  const DEF_BG = '#56606b';
  const get = k => P.get(k) ?? DEF[k];
  const on  = k => get(k) !== '0';

  const CHANNEL    = (P.get('channel') || '').toLowerCase().replace(/^#/, '').trim();
  const SIDE       = get('side') === 'right' ? 'right' : 'left';
  const SCALE      = parseFloat(get('scale')) || 1;
  const MAX        = Math.max(1, parseInt(get('max'), 10) || 12);
  const FADE       = Math.max(0, parseFloat(get('fade')) || 0);
  const EMOTE_MODE = ['inline','text'].includes(get('emotes')) ? get('emotes') : 'bubble';
  const EMOTE_SIZE = parseFloat(get('emotesize')) || 1;
  const EMOTE_MAX  = Math.max(1, parseInt(get('emotemax'), 10) || 3);
  const ANIMATED   = on('animated');
  const THIRD      = new Set(get('thirdparty') === '0' ? [] : get('thirdparty').toLowerCase().split(',').map(s => s.trim()));
  const TYPING     = on('typing');
  const EVENTS     = on('events');
  const SSN        = (P.get('ssn') || '').trim();                 // Social Stream Ninja session (multistream)
  const MULTI      = !!(SSN || P.get('setupssn'));
  const PLATFORM_ICONS = MULTI && on('platformicons');
  const ROLE_TAGS  = on('roles');
  const HIDE_CMDS  = on('hidecmds');
  const BOTS       = new Set(get('bots').toLowerCase().split(',').map(s => s.trim()).filter(Boolean));

  document.body.classList.add('lines', SIDE);
  if (!on('emotering')) document.body.classList.add('ring0');
  if (on('bob')) document.body.classList.add('bob');
  if (!on('portholes')) document.body.classList.add('noports');
  document.documentElement.style.setProperty('--scale', SCALE);
  document.documentElement.style.setProperty('--es', EMOTE_SIZE);

  // ---------- theme colour (hue slider) ----------
  // recolours the hull stripes, pennants, emote circles and @mentions. Chatters' own name colours are never changed.
  const DEF_HUE = 19;   // burnt orange
  const wrapHue = h => ((Math.round(h) % 360) + 360) % 360;
  function hslLum(h, s, l){   // perceived brightness (0-255) of an hsl colour
    s /= 100; l /= 100;

  const EVENT_LOOK = {
    Gift:  { cls:'gift', title:'Cargo aboard!',    art:BARREL },
    Raid:  { cls:'raid', title:'Raiders inbound!', art:CANNONS },
    Sub:   { cls:'sub',  title:'Welcome aboard',   art:BELL },
    Prime: { cls:'sub',  title:'Welcome aboard',   art:BELL },

    Donation:{ cls:'bits', title:'Treasure!',      art:CHEST },   // YouTube Super Chat / other tips (via Social Stream Ninja)
    Member:{ cls:'sub',  title:'Welcome aboard',   art:BELL },    // YouTube membership
  };

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const PALETTE = ['#FF4D5E','#FF8A3D','#3DA5FF','#9ACD32','#FFC23D','#3BE36B','#B07CFF','#FF69B4','#00C2C7','#FF7AA6'];
  function colorFor(name, given){
    if (given) return given;
    let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  const rgb = hex => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const lum = ([r,g,b]) => 0.299*r + 0.587*g + 0.114*b;
  function mute(hex, sMax = .42, lMin = .4, lMax = .6){   // tone chatters' colours down so nothing looks neon
    const c = rgb(hex); if (!c) return hex;
    const [r, g, b] = c.map(v => v / 255), max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0, s = 0, l = (max + min) / 2;
    if (d){
      s = d / (1 - Math.abs(2 * l - 1));
      h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h = (h * 60 + 360) % 360;
    }
    s = Math.min(s, sMax); l = Math.min(Math.max(l, lMin), lMax);
    return `hsl(${h.toFixed(0)} ${(s * 100).toFixed(0)}% ${(l * 100).toFixed(0)}%)`;
  }

  // ---------- emotes ----------
  const twitchEmote = id => `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(id)}/${ANIMATED ? 'default' : 'static'}/dark/3.0`;
  let TP = new Map();   // third-party emote name -> image url

  async function loadThirdParty(roomId){
    const j = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
    const bttv = list => (list || []).map(e => [e.code, `https://cdn.betterttv.net/emote/${e.id}/2x`]);
    const ffz  = list => (list || []).map(e => [e.code, e.images && (e.images['4x'] || e.images['2x'] || e.images['1x'])]);
    const stv  = set  => ((set && set.emotes) || []).map(e => [e.name, e.data && e.data.host ? `https:${e.data.host.url}/2x.webp` : null]);
    const jobs = [];   // order matters: globals first so channel emotes win name clashes
    if (THIRD.has('bttv')) jobs.push(j('https://api.betterttv.net/3/cached/emotes/global').then(bttv));
    if (THIRD.has('ffz'))  jobs.push(j('https://api.betterttv.net/3/cached/frankerfacez/emotes/global').then(ffz));
    if (THIRD.has('7tv'))  jobs.push(j('https://7tv.io/v3/emote-sets/global').then(stv));
    if (roomId){
      if (THIRD.has('bttv')) jobs.push(j(`https://api.betterttv.net/3/cached/users/twitch/${roomId}`).then(d => bttv(d && [...(d.channelEmotes||[]), ...(d.sharedEmotes||[])])));
      if (THIRD.has('ffz'))  jobs.push(j(`https://api.betterttv.net/3/cached/frankerfacez/users/twitch/${roomId}`).then(ffz));
      if (THIRD.has('7tv'))  jobs.push(j(`https://7tv.io/v3/users/twitch/${roomId}`).then(d => stv(d && d.emote_set)));
    }
    const results = await Promise.all(jobs);

    for (const list of results) for (const [name, url] of list) if (name && url) m.set(name, url);

  // Split a message into text + emote tokens.
  function tokenize(text, emotesTag){
    const chars = Array.from(text);            // Twitch emote ranges count code points
    const ranges = [];
    if (emotesTag) for (const part of emotesTag.split('/')){
      const [id, pos] = part.split(':'); if (!pos) continue;
      for (const r of pos.split(',')){ const [a, b] = r.split('-').map(Number); ranges.push({ id, a, b }); }
    }
    ranges.sort((x, y) => x.a - y.a);
    const tokens = [];
    const pushText = s => {
      if (!s) return;
      if (EMOTE_MODE === 'text' || !TP.size) { tokens.push({ t:'s', s }); return; }
      for (const part of s.split(/(\s+)/)){
        if (!part) continue;
        const url = TP.get(part);
        tokens.push(url ? { t:'e', name:part, url } : { t:'s', s:part });
      }
    };
    let i = 0;
    for (const r of ranges){
      if (r.a < i) continue;
      pushText(chars.slice(i, r.a).join(''));
      const name = chars.slice(r.a, r.b + 1).join('');
      if (EMOTE_MODE === 'text') tokens.push({ t:'s', s:name });
      else tokens.push({ t:'e', name, url: twitchEmote(r.id) });
      i = r.b + 1;
    }
    pushText(chars.slice(i).join(''));
    return tokens;
  }

  function renderInline(tokens){
    const units = tokens.reduce((n, t) => n + (t.t === 'e' ? 1 : Array.from(t.s).length), 0);
    const step = TYPING ? Math.min(30, 1100 / Math.max(units, 1)) : 0;
    let html = '', n = 0;
    const delay = () => TYPING ? ` style="animation-delay:${Math.round(140 + n++ * step)}ms"` : '';
    for (const t of tokens){
      if (t.t === 'e') html += `<img class="emote" alt="${esc(t.name)}" title="${esc(t.name)}" src="${esc(t.url)}"${delay()}>`;
      else for (const part of t.s.split(/(@[A-Za-z0-9_]+)/)){
        if (!part) continue;
        const m = part.length > 1 && part[0] === '@';
        if (TYPING) for (const ch of Array.from(part)) html += `<span class="ch${m ? ' mention' : ''}"${delay()}>${esc(ch)}</span>`;
        else html += m ? `<span class="mention">${esc(part)}</span>` : esc(part);
      }
    }
    return html;
  }

  function renderBig(emotes, tail = ''){
    const shown = emotes.slice(0, EMOTE_MAX), extra = emotes.length - shown.length;
    return `<div class="bigemotes">` +
      shown.map((e, i) => `<div class="bigemote" style="animation-delay:${i * 90}ms"><img alt="${esc(e.name)}" title="${esc(e.name)}" src="${esc(e.url)}"></div>`).join('') +
      (extra > 0 ? `<span class="more">+${extra}</span>` : '') + tail + `</div>`;
  }

  // ---------- platform icons (multistream) ----------
  const PLATFORM_SVG = {
    youtube:'<svg viewBox="0 0 24 24"><rect x="1.5" y="5" width="21" height="14" rx="4" fill="#ff0033"/><path d="M10 9v6l5.2-3z" fill="#fff"/></svg>',
    twitch:'<svg viewBox="0 0 24 24"><path d="M4.5 2 2.5 6.5V20h5v2.5h2.8l2.5-2.5h4l4.7-4.7V2z" fill="#9146ff"/><path d="M5 4.5h14v9.8l-3 3h-4.6L9 19.6v-2.3H5z" fill="#fff"/><path d="M11 7.5h1.9v5H11zM15.5 7.5h1.9v5h-1.9z" fill="#9146ff"/></svg>',
    kick:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4" fill="#53fc18"/><path d="M7 6h3v4h1.4L13.5 7.5V6H17v3l-2 2.5 2 2.5V18h-3.5v-2.2l-2-2.3H10V18H7z" fill="#0b0e0f"/></svg>',
  };
  const platformIcon = p => PLATFORM_ICONS && PLATFORM_SVG[p] ? `<span class="plat">${PLATFORM_SVG[p]}</span>` : '';

  // ---------- building messages ----------
  function shell(classes, { login, display, color, badges = [], userId, id, platform = 'twitch', badgeUrls = null }){
    let uc = colorFor(login, color);
    uc = mute(uc, .55, .6, .76);   // softened, but bright enough to read over video
    const el = document.createElement('div');
    el.className = 'msg ' + classes;
    el.dataset.id = id || '';
    el.dataset.user = userId || login;
    el.style.setProperty('--uc', uc);
    el.style.setProperty('--bobd', (4 + Math.random() * 1.8).toFixed(2) + 's');   // boats bob out of sync

    el.dataset.role = role;
    if (ANCHOR) el.classList.add('anc');
    if (R.color){ el.style.setProperty('--rc', R.color); el.style.setProperty('--ri', R.ink); }
    const badgeHtml = badgeUrls   // badges that came from another platform (already picture links)
      ? (SHOW_BADGES ? badgeUrls.map(u => `<img src="${esc(u)}" alt="" onerror="this.remove()">`).join('') : '')
      : badgeImgs(badges);
    const tag = ROLE_TAGS && R.tag ? `<b class="role">${R.label}</b>` : '';
    el.innerHTML = `<div class="name"><span class="nm">${platformIcon(platform)}${badgeHtml ? `<span class="badges">${badgeHtml}</span>` : ''}${esc(display || login)}${tag}</span></div>`;

  }
  function push(el){
    chat.appendChild(el);
    while (chat.children.length > MAX) chat.firstElementChild.remove();
    if (FADE > 0) setTimeout(() => removeEl(el), FADE * 1000);
  }
  function removeEl(el){
    if (!el.isConnected || el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 750);
  }

  function addMessage(m){
    if (BOTS.has(m.login)) return;
    if (HIDE_CMDS && m.text.trim().startsWith('!')) return;
    const tokens = m.tokens || tokenize(m.text, m.emotes);
    const emotes = tokens.filter(t => t.t === 'e');
    const emoteOnly = EMOTE_MODE === 'bubble' && emotes.length > 0 &&
                      tokens.every(t => t.t === 'e' || !t.s.trim());
    const el = shell((m.action ? 'action ' : '') + (emoteOnly ? 'emoteonly ' : '') + (TYPING ? 'typing' : ''), m);
    const content = emoteOnly ? renderBig(emotes, ANCHOR)
                              : `<div class="body"><span class="dot"></span>${renderInline(tokens)}${ANCHOR}</div>`;
    el.insertAdjacentHTML('beforeend', `<div class="row">${content}</div>`);
    push(el);
  }

  function addEvent(m, kind, info){
    if (!EVENTS || BOTS.has(m.login)) return;
    const look = EVENT_LOOK[kind] || EVENT_LOOK.Sub;
    const el = shell('event ev-' + look.cls, m);
    el.classList.remove('anc');   // alerts are their own card: no flag, hull or anchor
    const text = info.charAt(0).toLowerCase() + info.slice(1);
    el.innerHTML = `<div class="evart">${look.art}</div>` +
      `<div class="evtext"><div class="evtitle">${esc(look.title)}</div>` +
      `<div class="evline"><span class="evname">${esc(m.display || m.login)}</span> ${esc(text)}</div></div>`;

  }

  // ---------- Twitch IRC ----------
  const unescapeTag = v => v.replace(/\\(.)/g, (_, c) => ({ s:' ', ':':';', '\\':'\\', r:'\r', n:'\n' }[c] ?? c));
  function parse(line){
    const msg = { tags:{}, prefix:'', command:'', params:[], trailing:null };
    if (line[0] === '@'){
      const sp = line.indexOf(' ');
      for (const kv of line.slice(1, sp).split(';')){
        const e = kv.indexOf('=');
        if (e < 0) msg.tags[kv] = ''; else msg.tags[kv.slice(0, e)] = unescapeTag(kv.slice(e + 1));
      }
      line = line.slice(sp + 1);
    }
    if (line[0] === ':'){ const sp = line.indexOf(' '); msg.prefix = line.slice(1, sp); line = line.slice(sp + 1); }
    const t = line.indexOf(' :');
    if (t >= 0){ msg.trailing = line.slice(t + 2); line = line.slice(0, t); }
    const parts = line.split(' ');
    msg.command = parts[0]; msg.params = parts.slice(1);
    return msg;
  }
  const userOf = m => ({
    id: m.tags.id, userId: m.tags['user-id'],
    login: (m.tags.login || m.prefix.split('!')[0] || '').toLowerCase(),
    display: m.tags['display-name'], color: m.tags.color,
    badges: (m.tags.badges || '').split(',').filter(Boolean),   // raw "set/version", e.g. subscriber/12
  });

  const giftSkip = {};   // hides the individual "gifted a sub to X" lines after a "gifted 20 subs"
  let roomLoaded = false;

  function handleUserNotice(m){
    const t = m.tags, u = userOf(m), kind = t['msg-id'];
    const plural = (n, w) => `${n} ${w}${n == 1 ? '' : 's'}`;
    switch (kind){
      case 'sub': case 'resub': {
        const months = +t['msg-param-cumulative-months'] || 1;
        addEvent(u, t['msg-param-sub-plan'] === 'Prime' ? 'Prime' : 'Sub',
                 months > 1 ? `Subscribed · ${months} months` : 'Just subscribed');
        break;
      }
      case 'subgift': case 'anonsubgift': {
        if (giftSkip[u.login] > 0){ giftSkip[u.login]--; return; }
        addEvent(u, 'Gift', `Gifted a sub to ${t['msg-param-recipient-display-name'] || 'someone'}`);
        break;
      }
      case 'submysterygift': case 'anonsubmysterygift': {
        const n = +t['msg-param-mass-gift-count'] || 1;
        giftSkip[u.login] = (giftSkip[u.login] || 0) + n;
        addEvent(u, 'Gift', `Gifted ${plural(n, 'sub')}`);
        break;
      }
      case 'giftpaidupgrade': case 'anongiftpaidupgrade':
        addEvent(u, 'Sub', 'Continuing their gift sub'); break;
      case 'raid':
        addEvent(u, 'Raid', `Raided with ${plural(+t['msg-param-viewerCount'] || 0, 'viewer')}`); break;
      default: return;
    }
    if (m.trailing) addMessage({ ...u, id: u.id + '-msg', text: m.trailing, emotes: t.emotes });
  }

  // ---------- multistream: chat from YouTube etc. via Social Stream Ninja ----------
  // Messages arrive as small bits of HTML. Only plain text and emote pictures are kept — nothing else from them is ever run or shown.
  function htmlToTokens(html, textonly){
    if (textonly || !/[<&]/.test(html)) return tokenize(html, '');
    const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
    const tokens = [];
    const walk = node => {
      for (const n of node.childNodes){
        if (n.nodeType === 3) tokens.push(...tokenize(n.textContent, ''));
        else if (n.nodeName === 'IMG'){
          const src = n.getAttribute('src') || '', alt = n.getAttribute('alt') || '';
          if (EMOTE_MODE !== 'text' && /^(https?:|data:image\/)/i.test(src)) tokens.push({ t:'e', name:alt, url:src });
          else if (alt) tokens.push({ t:'s', s:alt });
        }
        else if (n.nodeType === 1 && !/^(SCRIPT|STYLE)$/.test(n.nodeName)) walk(n);
      }
    };
    walk(doc.body.firstElementChild || doc.body);
    return tokens;
  }
  function handleSSN(d){
    if (Array.isArray(d)) return d.forEach(handleSSN);
    if (!d || typeof d !== 'object') return;
    if (d.overlayNinja && typeof d.overlayNinja === 'object') d = d.overlayNinja;
    if (d.chatname === undefined && d.chatmessage === undefined) return;
    const platform = String(d.type || 'chat').toLowerCase();
    if (CHANNEL && platform === 'twitch') return;   // Twitch already comes in directly, with badges and alerts
    const display = String(d.chatname || '').trim() || 'someone';
    const login = display.toLowerCase();
    const tags = [];
    if (d.host) tags.push('broadcaster/1');
    if (d.mod) tags.push('moderator/1');
    if (d.vip) tags.push('vip/1');
    if (d.membership) tags.push('subscriber/0');
    const badgeUrls = (Array.isArray(d.chatbadges) ? d.chatbadges : [])
      .map(b => typeof b === 'string' ? b : (b && (b.src || b.url)))
      .filter(u => typeof u === 'string' && /^(https?:|data:image\/)/i.test(u));
    const u = { id:'ssn-' + (d.id ?? Math.random()), userId:login, login, display, platform, badges:tags, badgeUrls,
                color: /^#[0-9a-f]{6}$/i.test(d.nameColor || '') ? d.nameColor : '' };
    if (d.hasDonation) addEvent(u, 'Donation', platform.startsWith('youtube') ? `Sent a ${d.hasDonation} Super Chat` : `Sent ${d.hasDonation}`);
    else if (d.event){
      if (/member|sponsor/i.test(String(d.event))) addEvent(u, 'Member', 'Became a member');
      return;   // other system events (follows, joins, likes...) are skipped
    }
    const html = String(d.chatmessage || '');
    if (!html.trim()) return;
    const tokens = htmlToTokens(html, d.textonly);
    addMessage({ ...u, tokens, text: tokens.map(t => t.t === 'e' ? t.name : t.s).join('') });
  }
  let ssnBackoff = 1000;
  function connectSSN(){
    let sock;
    try { sock = new WebSocket(`wss://io.socialstream.ninja/join/${encodeURIComponent(SSN)}/4`); } catch { return; }
    sock.onopen = () => { ssnBackoff = 1000; };
    sock.onmessage = ev => { let d; try { d = JSON.parse(ev.data); } catch { return; } handleSSN(d); };
    sock.onclose = () => { setTimeout(connectSSN, ssnBackoff); ssnBackoff = Math.min(ssnBackoff * 2, 30000); };
  }

  let ws, backoff = 1000;
  function connect(){
    ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      backoff = 1000;
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
      ws.send('JOIN #' + CHANNEL);
    };
    ws.onmessage = ev => {
      for (const line of ev.data.split('\r\n')){
        if (!line) continue;
        const m = parse(line);
        switch (m.command){
          case 'PING': ws.send('PONG :' + (m.trailing || 'tmi.twitch.tv')); break;
          case 'ROOMSTATE':
            if (!roomLoaded && m.tags['room-id'] && EMOTE_MODE !== 'text' && THIRD.size){ roomLoaded = true; loadThirdParty(m.tags['room-id']); }
            break;
          case 'PRIVMSG': {
            let text = m.trailing || '', action = false;
            const am = /^\u0001ACTION (.*)\u0001$/.exec(text);
            if (am){ text = am[1]; action = true; }
            const u = userOf(m);
            if (m.tags.bits) addEvent(u, 'Bits', `Cheered ${m.tags.bits} bits`);
            addMessage({ ...u, text, emotes: m.tags.emotes, action });
            break;
          }
          case 'USERNOTICE': handleUserNotice(m); break;
          case 'CLEARMSG': {
            const id = m.tags['target-msg-id'];
            chat.querySelectorAll('.msg').forEach(el => { if (el.dataset.id === id || el.dataset.id === id + '-msg') removeEl(el); });
            break;
          }
          case 'CLEARCHAT': {
            const uid = m.tags['target-user-id'];
            chat.querySelectorAll('.msg').forEach(el => { if (!m.trailing || el.dataset.user === uid) removeEl(el); });
            break;
          }
          case 'RECONNECT': ws.close(); break;
        }
      }
    };
    ws.onclose = () => { setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 30000); };
  }

  // ---------- preview mode: demo chat + settings panel ----------
  function demo(){
    document.body.classList.add('demo');
    document.body.style.setProperty('--previewbg', P.get('bg') || DEF_BG);
    const E = { Kappa:25, LUL:425618, SeemsGood:64138, HeyGuys:30259, Kreygasm:41, BibleThump:86, NotLikeThis:58765, CoolCat:58127 };
    const emoteTag = str => {
      const map = {}; let pos = 0;
      for (const w of str.split(' ')){
        const len = Array.from(w).length;
        if (E[w]) (map[E[w]] ||= []).push(`${pos}-${pos + len - 1}`);
        pos += len + 1;
      }
      return Object.entries(map).map(([id, r]) => `${id}:${r.join(',')}`).join('/');
    };
    const people = {
      seven:['Seven','#FF4D5E',[]], jasmine:['Jasmine','#FFB13B',['subscriber/6']],
      olive:['Olive','#3BE36B',['artist-badge/1']], sayonani:['Sayonani','#FF4D5E',['vip/1','subscriber/3']],
      bunny:['WhiteBunny','#FFFFFF',['broadcaster/1','subscriber/0']], judge:['JudgeGavel','#FFD23F',['moderator/1','subscriber/12']],
      carrot:['carrotcake','#9ACD32',['founder/0']], lurker:['lurker_404','#7A6BFF',['premium/1']],
      mate:['FirstMate','#00C2C7',['lead_moderator/1','subscriber/24']],
      ytsailor:['DeckhandDana','#ff4e45',[],'youtube'], ytfan:['HarbourHank','#3ea6ff',['subscriber/0'],'youtube'],
    };
    const script = [
      ['m','seven','LUL that play was actually 200 IQ'],
      ['g','jasmine','Gift','Gifted 64 subs'],
      ['m','jasmine','Kreygasm Kreygasm Kreygasm Kreygasm Kreygasm Kreygasm Kreygasm Kreygasm'],
      ['m','olive','First'],
      ['m','sayonani','Is this ranked or unranked?'],
      ['m','bunny','welcome aboard everyone HeyGuys grab a life jacket'],
      ['m','judge','keep it cozy on deck SeemsGood'],
      ['m','mate','all hands on deck, stream is starting!'],
      ['g','carrot','Sub','Subscribed · 12 months'],
      ['m','carrot','a whole year of bunny streams BibleThump'],
      ['a','lurker','waves from the back row'],
      ['m','seven','NotLikeThis NotLikeThis'],
      ['g','lurker','Raid','Raided with 42 viewers'],
      ['g','judge','Bits','Cheered 500 bits'],
      ['m','olive','drew a little bunny for the stream CoolCat'],
    ];
    if (MULTI) script.splice(1, 0, ['m','ytsailor','hello from YouTube!'], ['g','ytfan','Donation','Sent $5.00'], ['m','ytfan','love the boats on both streams']);
    let n = 0;
    const tick = () => {
      const [type, who, a, b] = script[n % script.length];
      const [display, color, badges, platform = 'twitch'] = people[who];
      const u = { id:'d' + n, userId:who, login:display.toLowerCase(), display, color, badges, platform };
      n++;
      if (type === 'g') addEvent(u, a, b);
      else addMessage({ ...u, text:a, emotes:emoteTag(a), action:type === 'a' });
    };
    for (let i = 0; i < 5; i++) tick();
    setInterval(tick, 2200);
    buildPanel();
  }

  function buildPanel(){
    const cur = k => k === 'channel' ? (P.get('setupchannel') || '') : k === 'ssn' ? (P.get('setupssn') || '') : k === 'bg' ? (P.get('bg') || DEF_BG)
              : ['bttv','ffz','7tv'].includes(k) ? (THIRD.has(k) ? '1' : '0') : get(k);
    const sel = (k, opts) => `<select data-k="${k}">${opts.map(([v, l]) => `<option value="${v}"${cur(k) === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
    const chk = k => `<input type="checkbox" data-k="${k}"${cur(k) !== '0' ? ' checked' : ''}>`;
    const txt = (k, ph = '') => `<input type="text" data-k="${k}" value="${esc(cur(k))}" placeholder="${ph}">`;
    const num = (k, min, max) => `<input type="number" data-k="${k}" min="${min}" max="${max}" value="${esc(cur(k))}">`;
    const rng = (k, min, max, step) => `<span class="rv"><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${esc(cur(k))}"><output>${esc(cur(k))}</output></span>`;
    const row = (label, ctl) => `<label><span>${label}</span>${ctl}</label>`;

    const panel = document.createElement('div');
    panel.id = 'panel';
    panel.innerHTML = `
      <h2>Chat overlay settings <button class="x" title="Hide panel">&times;</button></h2>
      <p>The chat on the left is a live preview with fake messages.</p>
      <fieldset><legend>Basics</legend>
        ${row('Your channel', txt('channel', 'yourname'))}
        ${row('Side', sel('side', [['left','Left'],['right','Right']]))}
        ${row('Theme colour', `<span class="rv"><input type="range" class="hue" data-k="hue" min="0" max="359" step="1" value="${HUE}"${HUE_SET ? ' data-touched="1"' : ''}><i class="sw"></i></span>`)}
        <label><span></span><button class="link" type="button" data-reset-hue>Reset to default colours</button></label>
        ${row('Overall size', rng('scale', .6, 2, .05))}
        ${row('Max messages', num('max', 1, 50))}
        ${row('Fade after (sec, 0 = never)', num('fade', 0, 600))}
      </fieldset>
      <fieldset><legend>Emotes</legend>
        ${row('Emote style', sel('emotes', [['bubble','Solo emotes: big, own look'],['inline','Always text-sized'],['text','Names only, no images']]))}
        ${row('Emote size', rng('emotesize', .5, 2.5, .05))}
        ${row('Solo emotes shown before +N', num('emotemax', 1, 12))}
        ${row('Circle behind solo emotes', chk('emotering'))}
        ${row('Animated Twitch emotes', chk('animated'))}
        ${row('BetterTTV emotes', chk('bttv'))}
        ${row('FrankerFaceZ emotes', chk('ffz'))}
        ${row('7TV emotes', chk('7tv'))}
      </fieldset>
      <fieldset><legend>Extras</legend>
        ${row('Typing animation', chk('typing'))}
        ${row('Twitch badges (incl. sub badges)', chk('badges'))}
        ${row('Anchor + logo on each line', chk('anchor'))}
        ${row('Your own logo (image link)', txt('logo', 'empty = sailboat'))}
        ${row('Role names on name tags', chk('roles'))}
        ${row('Extra head mods', txt('headmods', 'name1, name2'))}
        ${row('Bobbing boats', chk('bob'))}
        ${row('Portholes on the hull', chk('portholes'))}
        ${row('Subs, gifts &amp; raids', chk('events'))}
        ${row('Hide !commands', chk('hidecmds'))}
        ${row('Hidden bots', txt('bots'))}
      </fieldset>
      <p style="margin-top:8px">Sub and bit badges come from your channel automatically — type your channel above to preview them. Head Mod = Twitch's Lead Moderator badge, plus anyone in Extra head mods.</p>
      <fieldset><legend>Multistream (YouTube + more)</legend>
        ${row('Social Stream Ninja session', txt('ssn', 'session ID'))}
        ${row('Platform icons on names', chk('platformicons'))}
        <p style="margin-top:6px">Optional. Shows YouTube (and Kick, etc.) chat in the same boats. Use the free <b>Social Stream Ninja</b> tool (socialstream.ninja) with your YouTube chat open, turn on <b>Global settings → Mechanics → "Enable remote API control of extension"</b> and <b>"Send chat messages to API server"</b>, then paste its session ID here. Leave empty if you only stream on Twitch.</p>
      </fieldset>
      <fieldset><legend>Preview only</legend>
        ${row('Preview background', `<input type="color" data-k="bg" value="${esc(cur('bg'))}">`)}
      </fieldset>
      <fieldset><legend>Your OBS URL</legend>
        <textarea readonly></textarea>
        <div class="warn"></div>
        <button class="btn" data-copy="url">Copy OBS URL</button>
        <button class="btn btn2" data-copy="widget">Copy widget code (Pogly etc.)</button>
        <p class="widgetnote" style="margin-top:6px"></p>
      </fieldset>`;
    document.body.appendChild(panel);
    const gear = document.createElement('button');
    gear.id = 'gear'; gear.textContent = 'Settings';
    document.body.appendChild(gear);
    panel.querySelector('.x').onclick = () => { panel.classList.add('hidden'); gear.classList.add('show'); };
    gear.onclick = () => { panel.classList.remove('hidden'); gear.classList.remove('show'); };

    const collect = () => {
      const v = {};
      panel.querySelectorAll('[data-k]').forEach(i => { v[i.dataset.k] = i.type === 'checkbox' ? (i.checked ? '1' : '0') : i.value.trim(); });
      v.thirdparty = ['bttv','ffz','7tv'].filter(k => v[k] === '1').join(',') || '0';
      if (!hueInput.dataset.touched) delete v.hue;   // untouched slider = default colours
      return v;
    };
    const hueInput = panel.querySelector('input.hue');
    const params = (v, preview) => {
      const q = new URLSearchParams();
      const ch = (v.channel || '').toLowerCase().replace(/^#/, '').replace(/^https?:\/\/(www\.)?twitch\.tv\//, '').replace(/[^a-z0-9_]/g, '');
      if (!preview && ch) q.set('channel', ch);
      for (const k in DEF) if (v[k] !== undefined && v[k] !== '' && v[k] !== DEF[k]) q.set(k, v[k]);
      if (v.hue !== undefined) q.set('hue', v.hue);
      if (preview){ if (ch) q.set('setupchannel', ch); if (v.bg && v.bg.toLowerCase() !== DEF_BG) q.set('bg', v.bg);
        if (q.has('ssn')){ q.set('setupssn', q.get('ssn')); q.delete('ssn'); } }   // the preview never connects for real
      return { q, ch };
    };
    const base = location.href.split('#')[0].split('?')[0];
    const out = panel.querySelector('textarea'), warn = panel.querySelector('.warn');
    const refreshUrl = () => {
      const { q, ch } = params(collect(), false);
      out.value = base + (q.toString() ? '?' + q : '');
      warn.textContent = (ch || q.has('ssn')) ? '' : 'Type your channel name above so the overlay knows whose chat to show.';
    };
    refreshUrl();
    panel.addEventListener('input', e => {
      if (e.target === hueInput){            // recolour live while dragging
        hueInput.dataset.touched = '1';
        applyHue(+hueInput.value, true);
      } else if (e.target.type === 'range') e.target.nextElementSibling.textContent = e.target.value;
      refreshUrl();
    });
    panel.addEventListener('change', e => {   // re-run the preview with the new look
      if (!e.target.dataset.k) return;
      const { q } = params(collect(), true);
      if (e.target === hueInput){             // already applied live: just remember it, no reload
        history.replaceState(null, '', '?' + q);
        return;
      }
      location.search = q.toString();
    });
    panel.querySelector('[data-reset-hue]').onclick = () => {
      delete hueInput.dataset.touched;
      hueInput.value = DEF_HUE;
      applyHue(DEF_HUE, false);
      refreshUrl();
      const { q } = params(collect(), true);
      history.replaceState(null, '', '?' + q);
    };
    // widget code for tools that take custom HTML (Pogly, etc.): loads this overlay, see-through, filling the widget box
    const widgetCode = () =>
      `<iframe src="${out.value.replace(/"/g, '%22')}" allowtransparency="true" scrolling="no" ` +
      `style="position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;color-scheme:normal;overflow:hidden"></iframe>`;
    const note = panel.querySelector('.widgetnote');
    note.textContent = location.protocol === 'file:'
      ? 'Widget code only works from your online link (e.g. GitHub Pages), not from a file on your computer.'
      : 'Paste the widget code into a new HTML widget, then size the widget box (about 460 × 760).';
    panel.querySelectorAll('[data-copy]').forEach(btn => btn.onclick = async () => {
      const text = btn.dataset.copy === 'widget' ? widgetCode() : out.value;
      const label = btn.textContent;
      try { await navigator.clipboard.writeText(text); }
      catch {
        const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
        t.select(); document.execCommand('copy'); t.remove();
      }
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = label, 1500);
    });
  }

  // Inside OBS the page is always see-through: no preview background, no settings panel.
  const IN_OBS = !!window.obsstudio;
  loadBadges(CHANNEL || (P.get('setupchannel') || '').toLowerCase());
  if (CHANNEL || SSN){
    if (CHANNEL) connect();
    if (SSN) connectSSN();
  }
  else if (IN_OBS){
    const n = document.createElement('div');
    n.id = 'obsnote';
    n.innerHTML = 'Chat overlay: no channel (or multistream session) set yet.<br>Open this link in a normal browser, type your channel, press <b>Copy OBS URL</b>, and paste that into this source instead.';
    document.body.appendChild(n);
  }
  else demo();
})();
</script>
</body>
</html>
